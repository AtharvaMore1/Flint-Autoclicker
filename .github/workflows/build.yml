name: Build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
      - name: Compile
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/ucrt64
          cmake --build build
      - name: Package Windows app
        run: python tools/package.py
      - name: Check packaged app starts without Qt installed
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:QT_QUICK_BACKEND = 'software'
          $env:QT_FORCE_STDERR_LOGGING = '1'
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML_IMPORT_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath "$pwd/dist/FlintAutoClicker.exe" -WorkingDirectory "$pwd/dist" -WindowStyle Hidden -PassThru -RedirectStandardError "$env:RUNNER_TEMP/startup.log"
          try {
            Start-Sleep -Seconds 5
            if ($app.HasExited) {
              Get-Content "$env:RUNNER_TEMP/startup.log"
              throw "Packaged app exited during startup (exit code $($app.ExitCode))."
            }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }
      - name: Build portable executable
        run: python tools/portable.py
      - name: Check portable executable
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:QT_QUICK_BACKEND = 'software'
          $env:QT_FORCE_STDERR_LOGGING = '1'
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML_IMPORT_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          $downloadDir = Join-Path $env:RUNNER_TEMP 'Portable download ü with spaces'
          New-Item -ItemType Directory -Path $downloadDir | Out-Null
          $download = Join-Path $downloadDir 'My renamed autoclicker.exe'
          Copy-Item build/portable/FlintAutoClicker.exe -Destination $download
          function Check-Launch {
            $launcher = Start-Process -FilePath $download -WorkingDirectory $downloadDir -WindowStyle Hidden -PassThru
            $child = $null
            try {
              $deadline = (Get-Date).AddSeconds(60)
              while ((Get-Date) -lt $deadline -and !$launcher.HasExited) {
                $child = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($launcher.Id) AND Name = 'FlintAutoClicker.exe'" | Select-Object -First 1
                if ($child) { break }
                Start-Sleep -Seconds 1
              }
              if (!$child) { throw 'Portable download did not launch the app.' }
              Start-Sleep -Seconds 3
              if (!(Get-Process -Id $child.ProcessId -ErrorAction SilentlyContinue)) { throw 'Portable app exited during startup.' }
              return $child.ExecutablePath
            } finally {
              if ($child) { Stop-Process -Id $child.ProcessId -ErrorAction SilentlyContinue }
              if (!$launcher.WaitForExit(5000)) { Stop-Process -Id $launcher.Id }
            }
          }
          $appPath = Check-Launch
          $null = Check-Launch
          $cacheRoot = [IO.Path]::GetFullPath("$env:LOCALAPPDATA/FlintAutoClicker/Runtime") + [IO.Path]::DirectorySeparatorChar
          if (!$appPath.StartsWith($cacheRoot, [StringComparison]::OrdinalIgnoreCase)) { throw 'Unexpected cache path.' }
          Remove-Item -LiteralPath (Join-Path (Split-Path $appPath) 'Qt6Core.dll')
          $null = Check-Launch
          Write-Output 'First launch, cached launch, renamed Unicode path, and missing-file recovery passed.'
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: FlintAutoClicker-portable-exe
          path: build/portable/FlintAutoClicker.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FlintAutoClicker-portable-exe
          path: portable
      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $notes = @'
          ## FlintAutoClicker for Windows

          - Customizable autoclicker with toggle and hold hotkeys.
          - Mouse and keyboard macro recording, sequence editing, and save/load.
          - Continuous or counted playback, custom speed, and loop gaps.
          - Light/dark themes and remembered settings.

          ### Download

          Download FlintAutoClicker.exe below and double-click to open it. No installation, manual extraction, Qt installation, or administrator access is needed. The first launch automatically prepares its supporting files; later launches reuse them.

          '@
          $notes | Set-Content -Path release-notes.md -Encoding utf8
          gh release create "$env:RELEASE_TAG" "portable/FlintAutoClicker.exe" --repo "$env:GH_REPO" --verify-tag --title "FlintAutoClicker $env:RELEASE_TAG" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release.' }

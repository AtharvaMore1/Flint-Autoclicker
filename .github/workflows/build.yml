name: Build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
      - name: Compile
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/ucrt64
          cmake --build build
      - name: Package Windows app
        run: python tools/package.py
      - name: Check packaged app starts without Qt installed
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:QT_QUICK_BACKEND = 'software'
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML_IMPORT_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath "$pwd/dist/FlintAutoClicker.exe" -WorkingDirectory "$pwd/dist" -WindowStyle Hidden -PassThru -RedirectStandardError "$env:RUNNER_TEMP/startup.log"
          try {
            Start-Sleep -Seconds 5
            if ($app.HasExited) {
              Get-Content "$env:RUNNER_TEMP/startup.log"
              throw "Packaged app exited during startup (exit code $($app.ExitCode))."
            }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: FlintAutoClicker-windows-x64
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FlintAutoClicker-windows-x64
          path: dist
      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $archive = "FlintAutoClicker-$env:RELEASE_TAG-windows-x64.zip"
          Compress-Archive -Path dist/* -DestinationPath $archive
          $notes = @'
          ## FlintAutoClicker for Windows

          - Customizable autoclicker with toggle and hold hotkeys.
          - Mouse and keyboard macro recording, sequence editing, and save/load.
          - Continuous or counted playback, custom speed, and loop gaps.
          - Light/dark themes and remembered settings.

          ### Download

          Download the Windows x64 ZIP below, extract the entire folder, and run FlintAutoClicker.exe. Keep the DLLs and subfolders beside the executable. No Qt installation is needed.
          '@
          $notes | Set-Content -Path release-notes.md -Encoding utf8
          gh release create "$env:RELEASE_TAG" "$archive" --repo "$env:GH_REPO" --verify-tag --title "FlintAutoClicker $env:RELEASE_TAG" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release.' }
